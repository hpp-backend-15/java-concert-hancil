#spring.application.name=java-concert-hancil

spring:
  datasource:
    url: jdbc:mysql://localhost:23306/concert
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update  # 필요에 따라 create, validate 등 선택 가능
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost
      port: 6379

springdoc:
  packages-to-scan: io.hhplus.javaconcerthancil
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8

#  localhost:8080/hhplus에 명시된 API 명세를 순차적으로 진행하여,
#  API가 정상적으로 기능을 제공하도록 하였습니다.

  swagger-ui:
    path: /hhplus
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: alpha
server:
  port: 48080
  tomcat:
    threads:
      max: 200
